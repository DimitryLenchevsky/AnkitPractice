<template>
    <article class="slds-card">
        <div class="slds-card__header slds-grid">
            <div class={computedHeaderClass}>
                <div class="slds-var-p-around-small">
                    <spam class="slds-text-heading_small">{title}</spam>
                </div>
            </div>
        </div>
        <div class="slds-card__body slds-card__body_inner">
            <div class="slds-var-p-around-small">
                <p>{message}</p>
                <template if:true={showButton}>
                    <lightning-button title={ctaLabel} label={ctaLabel} onclick={handleClick}></lightning-button>
                </template>
            </div>
        </div>
    </article>
</template>
